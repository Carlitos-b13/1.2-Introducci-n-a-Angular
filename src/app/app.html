<div class="contenedor">
  <h1>{{ titulo }}</h1>

  <div class="contador">
    Talleres seleccionados: {{ inscritos().length }}
  </div>

  <div class="talleres">
    @for (taller of talleres; track taller.id) {
      <div class="tarjeta">
        <h2>{{ taller.nombre }}</h2>

        <p>Duración: {{ taller.duracion }}</p>

        <button
          (click)="inscribirse(taller.id)"
          [disabled]="inscritos().includes(taller.id)"
        >
          Inscribirme
        </button>

        @if (inscritos().includes(taller.id)) {
          <div class="confirmacion">
            Ya estás inscrito
          </div>

          <button
            class="cancelar"
            (click)="cancelarInscripcion(taller.id)"
          >
            Cancelar inscripción
          </button>
        }
      </div>
    }
  </div>
</div>
